<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ᛖᛉ ᛢᛜᛈᛙᚣᚳ — psycho_b1o</title>
  <meta name="description" content="Angelic, gothic, bloody bio page for psycho_b1o" />
  <meta property="og:title" content="ᛖᛉ ᛢᛜᛈᛙᚣᚳ — psycho_b1o" />
  <meta property="og:image" content="image-2.png" />

  <style>
    :root {
      --bg: oklch(0.10 0.004 265);
      --fg: oklch(0.95 0.008 265);
      --card: oklch(0.15 0.01 265);
      --muted: oklch(0.70 0.015 265);
      --border: oklch(1 0 0 / 12%);

      --blood: oklch(0.38 0.11 17);
      --blood-deep: oklch(0.22 0.08 17);
      --blood-glow: oklch(0.35 0.12 17 / 45%);

      --angel-glow: oklch(0.88 0.03 90 / 28%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .rune {
      font-family: "Segoe UI Historic", "Noto Sans Runic", Georgia, serif;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .bg-fog {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.22;
      mix-blend-mode: screen;
      pointer-events: none;
      filter: brightness(1.05) contrast(1.0) saturate(0.7);
    }

    .bg-angel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 72vh;
      width: 100%;
      object-fit: cover;
      opacity: 0.38; /* чуть темнее */
      filter: grayscale(0.5) brightness(0.95) contrast(1.05) saturate(0.7);
      pointer-events: none;
      mask-image: linear-gradient(to bottom, black 5%, transparent 92%);
      -webkit-mask-image: linear-gradient(to bottom, black 5%, transparent 92%);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, var(--angel-glow) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 30%, transparent 10%, var(--bg) 85%);
      pointer-events: none;
    }

    .rays {
      position: absolute;
      inset: 0;
      background: repeating-conic-gradient(
        from 0deg at 50% -10%,
        transparent 0deg,
        oklch(0.9 0.03 90 / 3%) 2deg,
        transparent 6deg
      );
      opacity: 0.28;
      pointer-events: none;
      mix-blend-mode: soft-light;
    }

    /* ===== Кровавый пол ===== */
    .blood-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48vh;
      width: 100%;
      object-fit: cover;
      object-position: center bottom;
      opacity: 0.55;
      filter: blur(12px) saturate(1.8) brightness(0.6) contrast(1.15);
      mask-image: linear-gradient(to top, black 0%, black 25%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 0%, black 25%, transparent 100%);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      margin: 0 auto;
      max-width: 24rem;
      min-height: 100vh;
      padding: 0 1.3rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Аватар — правильный масштаб + плавный переход ===== */
    .avatar-hero {
      width: 100%;
      max-width: 280px;          /* чуть уже, чтобы не было кривых краёв */
      margin: 0 auto 0.8rem;
      position: relative;
      overflow: hidden;
    }

    .avatar-hero img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;       /* сохраняем пропорции */
      object-position: center top;
      filter: grayscale(0.35) contrast(1.18) brightness(0.9);
      /* очень плавный fade вниз */
      mask-image: linear-gradient(
        to bottom,
        black 0%,
        black 45%,
        rgba(0,0,0,0.85) 65%,
        rgba(0,0,0,0.4) 82%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        black 0%,
        black 45%,
        rgba(0,0,0,0.85) 65%,
        rgba(0,0,0,0.4) 82%,
        transparent 100%
      );
    }

    /* мягкое кровавое свечение под авой */
    .avatar-hero::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 5%;
      height: 40%;
      background: radial-gradient(ellipse, var(--blood-glow), transparent 70%);
      opacity: 0.3;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    h1 {
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      line-height: 1.4;
      max-width: 100%;
      padding: 0 0.2rem;
      word-break: break-all;
      text-shadow:
        0 0 16px var(--blood-glow),
        0 0 32px var(--angel-glow);
      animation: softPulse 6s ease-in-out infinite;
      margin-top: -0.8rem;
    }

    @keyframes softPulse {
      0%, 100% { text-shadow: 0 0 14px var(--blood-glow), 0 0 28px var(--angel-glow); }
      50% { text-shadow: 0 0 22px var(--blood-glow), 0 0 42px var(--angel-glow); }
    }

    .player {
      margin-top: 1.8rem;
      width: 100%;
      background: linear-gradient(
        145deg,
        color-mix(in oklab, var(--card) 70%, transparent),
        color-mix(in oklab, var(--blood-deep) 18%, transparent)
      );
      border: 1px solid color-mix(in oklab, var(--blood) 35%, transparent);
      border-radius: 1rem;
      padding: 1.1rem 1.15rem 1.3rem;
      backdrop-filter: blur(14px);
      box-shadow:
        0 0 26px var(--blood-glow),
        inset 0 1px 0 oklch(1 0 0 / 7%);
      position: relative;
      overflow: hidden;
    }

    .player::before {
      content: "";
      position: absolute;
      top: -40%;
      left: -20%;
      width: 140%;
      height: 80%;
      background: radial-gradient(ellipse, var(--angel-glow), transparent 70%);
      opacity: 0.22;
      pointer-events: none;
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--blood);
      background: radial-gradient(circle at 35% 30%, oklch(0.32 0.10 17), var(--blood-deep));
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--blood-glow);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 26px var(--blood-glow);
    }
    .play-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .play-btn .pause-icon { display: none; }
    .play-btn.playing .play-icon { display: none; }
    .play-btn.playing .pause-icon { display: block; }

    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-title {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-sub {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .timeline-wrap {
      position: relative;
      z-index: 1;
      padding-top: 0.4rem;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.45rem;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      position: relative;
      height: 7px;
      background: oklch(0.16 0.02 17);
      border-radius: 999px;
      overflow: visible;
      cursor: pointer;
      border: 1px solid color-mix(in oklab, var(--blood) 40%, transparent);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blood-deep), var(--blood), oklch(0.45 0.13 17));
      box-shadow: 0 0 12px var(--blood-glow);
      position: relative;
      transition: width 0.1s linear;
    }

    .blood-drops {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 22px;
      pointer-events: none;
      overflow: visible;
    }

    .drop {
      position: absolute;
      top: -2px;
      width: 6px;
      height: 10px;
      background: var(--blood);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform: translateX(-50%);
      opacity: 0.85;
      box-shadow: 0 0 6px var(--blood-glow);
      animation: drip 2.8s ease-in infinite;
    }
    .drop:nth-child(1) { left: 18%; animation-delay: 0s; }
    .drop:nth-child(2) { left: 42%; animation-delay: 0.7s; width: 5px; height: 8px; }
    .drop:nth-child(3) { left: 68%; animation-delay: 1.4s; }
    .drop:nth-child(4) { left: 88%; animation-delay: 0.3s; width: 4px; height: 7px; }

    @keyframes drip {
      0%   { transform: translateX(-50%) translateY(0) scaleY(1); opacity: 0.9; }
      70%  { opacity: 0.7; }
      100% { transform: translateX(-50%) translateY(16px) scaleY(1.3); opacity: 0; }
    }

    .tagline {
      margin-top: 2.3rem;
      text-align: center;
      font-size: 1.15rem;
      letter-spacing: 0.32em;
      color: var(--blood);
      text-shadow: 0 0 16px var(--blood-glow);
    }

    nav {
      margin-top: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(
        105deg,
        color-mix(in oklab, var(--card) 60%, transparent),
        color-mix(in oklab, var(--blood) 14%, transparent)
      );
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      backdrop-filter: blur(12px);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    }
    .link-card:hover {
      border-color: color-mix(in oklab, var(--blood) 55%, transparent);
      box-shadow: 0 0 26px var(--blood-glow);
      transform: translateY(-2px);
    }
    .link-card .rune {
      font-size: 1.15rem;
      color: var(--blood);
    }
    .link-card .label {
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .link-card .arrow {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--muted);
      transition: transform 0.3s;
    }
    .link-card:hover .arrow { transform: translateX(4px); }

    .footer {
      margin-top: 2.8rem;
      font-size: 10px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: color-mix(in oklab, var(--muted) 60%, transparent);
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="bg-fog" src="image-3.png" alt="" aria-hidden="true" />
    <img class="bg-angel" src="image-2.png" alt="" aria-hidden="true" />
    <div class="vignette"></div>
    <div class="rays"></div>

    <img class="blood-floor" src="image-5.png" alt="" aria-hidden="true" />

    <div class="content">
      <div class="avatar-hero">
        <img src="avatar.png" alt="psycho_b1o" />
      </div>

      <h1 class="rune">ᛒᚳᛜᛜᚦ_ᛜᚻ_ᛖᛉ_ᛒᛜᚦᛉ</h1>

      <div class="player">
        <div class="player-top">
          <button class="play-btn" id="playBtn" aria-label="Play / Pause">
            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <div class="track-info">
            <div class="track-title rune">ᛖᛉ ᛗᚢᛊᛁᚳ</div>
            <div class="track-sub">psycho_b1o • now playing</div>
          </div>
        </div>

        <div class="timeline-wrap">
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
            <div class="blood-drops">
              <div class="drop"></div>
              <div class="drop"></div>
              <div class="drop"></div>
              <div class="drop"></div>
            </div>
          </div>
        </div>
      </div>

      <p class="tagline rune">ᛖᛉ ᛢᛜᛈᛙᚣᚳ ᛖᛊᚦᛙᚣ</p>

      <nav id="links"></nav>

      <p class="footer">psycho_b1o</p>
    </div>
  </main>

  <audio id="audio" src="music.mp3" preload="metadata"></audio>

  <script>
    const links = [
      { label: "TikTok",     rune: "ᛏ", href: "https://www.tiktok.com/@psycho_b1o" },
      { label: "Instagram",  rune: "ᛁ", href: "https://www.instagram.com/__._saint?igsh=NTc4MTIwNjQ2YQ%3D%3D&utm_source=qr" },
      { label: "My Music",   rune: "ᛗ", href: "https://t.me/blood_on_music" },
      { label: "Discord",    rune: "ᛞ", href: "https://discord.gg/P9aqyGCSG" },
    ];

    const nav = document.getElementById("links");
    links.forEach(l => {
      const a = document.createElement("a");
      a.href = l.href;
      a.target = "_blank";
      a.rel = "noreferrer";
      a.className = "link-card";
      a.innerHTML = `
        <span class="rune">${l.rune}</span>
        <span class="label">${l.label}</span>
        <span class="arrow">→</span>
      `;
      nav.appendChild(a);
    });

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const progressTrack = document.getElementById("progressTrack");
    const progressFill = document.getElementById("progressFill");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");

    function formatTime(sec) {
      if (!isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, "0")}`;
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        playBtn.classList.add("playing");
      } else {
        audio.pause();
        playBtn.classList.remove("playing");
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + "%";
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener("ended", () => {
      playBtn.classList.remove("playing");
      progressFill.style.width = "0%";
    });

    function seek(e) {
      const rect = progressTrack.getBoundingClientRect();
      const clientX = e.clientX ?? e.touches?.[0]?.clientX;
      const pct = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
      audio.currentTime = pct * audio.duration;
    }

    progressTrack.addEventListener("click", seek);

    let isDragging = false;
    progressTrack.addEventListener("mousedown", (e) => {
      isDragging = true;
      seek(e);
    });
    window.addEventListener("mousemove", (e) => {
      if (isDragging) seek(e);
    });
    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    progressTrack.addEventListener("touchstart", (e) => {
      isDragging = true;
      seek(e);
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (isDragging) seek(e);
    }, { passive: true });
    window.addEventListener("touchend", () => {
      isDragging = false;
    });
  </script>
</body>
</html>
